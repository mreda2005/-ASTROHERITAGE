<!DOCTYPE html>
<html lang="en" dir="ltr">
  <!--
بالنسبة للكود (Code): أضيفي تعليقاً (Comment) في بداية ملفات الـ HTML والـ JS يوضح أن الكود تمت كتابته بمساعدة الذكاء الاصطناعي، هكذا:  This code was developed with the assistance of SI tools (Google Gemini) -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroHeritage | Space Archaeology & Exploration</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;700;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --navy: #07152f;
      --navy-2: #0c2347;
      --navy-3: #173d68;
      --abyss: #030914;
      --sky: #3cafe8;
      --cyan: #00f0ff;
      --gold: #ffd700;
      --text: #eef7ff;
      --muted: #9db4cc;
      --line: rgba(60, 175, 232, .32);
      --glass: rgba(12, 35, 71, .66);
      --topbar-h: 64px;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--navy);
      color: var(--text)
    }

    html[dir="ltr"] body {
      font-family: Inter, Cairo, system-ui, sans-serif
    }

    html[dir="rtl"] body {
      font-family: Cairo, Inter, system-ui, sans-serif
    }

    body {
      overflow: hidden;
      -webkit-font-smoothing: antialiased
    }

    button {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px
    }

    .portal {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      isolation: isolate;
      background: #030a16
    }

    .space-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden
    }

    .orbital-network-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0
    }

    .space-background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, transparent 20%, #030a16 90%);
      opacity: .8;
      z-index: 1
    }

    .portal > * {
      position: relative;
      z-index: 1
    }

    .portal > .space-background {
      position: fixed;
      z-index: 0
    }

    /* ---------- Top bar (single source of navigation) ---------- */
    .topbar {
      position: relative;
      z-index: 10;
      flex: none;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
      min-height: var(--topbar-h);
      padding: 8px clamp(14px, 3vw, 38px);
      background: rgba(4, 13, 30, .94);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 8px 30px #0006;
      backdrop-filter: blur(10px)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      text-align: start
    }

    .logo {

      width: 64px;
      height: 64px;
      flex: none;
      object-fit: contain;
    }

    .logءءo {
      width: 42px;
      height: 42px;
      flex: none;
      object-fit: contain;

      border-radius: 50%;
      box-shadow: 0 0 18px #3cafe855;
      animation: pulse 4s ease-in-out infinite alternate
    }

    @keyframes pulse {
      from {
        box-shadow: 0 0 8px #3cafe833
      }

      to {
        box-shadow: 0 0 22px #ffd70066
      }
    }

    .brand strong {
      display: block;
      font-size: clamp(15px, 2vw, 21px);
      font-weight: 900;
      letter-spacing: .14em;
      white-space: nowrap;
      text-transform: uppercase
    }

    .brand strong b {
      color: var(--gold);
      font-weight: 900
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-top: 2px;
      white-space: nowrap
    }

    html[dir="rtl"] .brand small {
      letter-spacing: .02em
    }

    .main-nav {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap
    }

    .tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #397eaa;
      background: #102b50;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: .2s;
      white-space: nowrap
    }

    .tab:hover {
      background: rgba(60, 175, 232, .25)
    }

    .tab[aria-current="page"] {
      background: var(--sky);
      color: #06152a;
      border-color: var(--sky);
      box-shadow: 0 0 18px #3cafe866
    }

    .tab .ico {
      font-size: 16px;
      line-height: 1
    }

    .lang-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      padding: 9px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: .2s
    }

    .lang-btn:hover {
      background: var(--gold);
      color: #14213a
    }

    /* ---------- Contextual sub-navigation ---------- */
    .subbar {
      flex: none;
      position: relative;
      z-index: 9;
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      padding: 8px clamp(14px, 3vw, 38px);
      background: rgba(7, 21, 47, .92);
      border-bottom: 1px solid rgba(60, 175, 232, .18);
      scrollbar-width: none
    }

    .subbar::-webkit-scrollbar {
      display: none
    }

    .subbar[hidden] {
      display: none
    }

    .subbar .section-label {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 700;
      padding-inline-end: 12px;
      margin-inline-end: 4px;
      border-inline-end: 1px solid var(--line);
      white-space: nowrap
    }

    html[dir="rtl"] .subbar .section-label {
      letter-spacing: .02em
    }

    .chip {
      border: 1px solid rgba(60, 175, 232, .35);
      background: transparent;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #cfe6f7;
      transition: .2s;
      white-space: nowrap
    }

    .chip:hover {
      border-color: var(--sky);
      color: #fff;
      background: rgba(60, 175, 232, .12)
    }

    .chip[aria-current="page"] {
      background: rgba(255, 215, 0, .14);
      border-color: var(--gold);
      color: var(--gold)
    }

    /* ---------- Workspace ---------- */
    .workspace {
      flex: 1;
      min-height: 0;
      position: relative
    }

    .panel {
      display: none;
      position: absolute;
      inset: 0
    }

    .panel.active {
      display: block
    }

    iframe {
      display: block;
      border: 0;
      width: 100%;
      height: 100%;
      background: var(--navy)
    }

    .loader {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: var(--navy);
      transition: opacity .3s
    }

    .loader[hidden] {
      display: none
    }

    .loader i {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid var(--line);
      border-top-color: var(--gold);
      animation: spin .9s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    /* ---------- Home ---------- */
    .home {
      height: 100%;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 18px
    }

    .home-inner {
      width: min(100%, 1000px);
      text-align: center
    }

    .eyebrow {
      color: var(--gold);
      font-size: 12px;
      letter-spacing: .24em;
      text-transform: uppercase;
      font-weight: 700
    }

    html[dir="rtl"] .eyebrow {
      letter-spacing: .06em
    }

    h1 {
      font-size: clamp(34px, 7vw, 68px);
      line-height: 1.15;
      margin: 16px 0;
      font-weight: 900;
      background: linear-gradient(90deg, var(--sky), #fff, var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .lead {
      max-width: 720px;
      margin: 0 auto;
      color: #b9cce0;
      font-size: clamp(15px, 2vw, 19px);
      line-height: 1.8
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin: 38px auto 0;
      max-width: 850px;
      text-align: start
    }

    .card {
      position: relative;
      overflow: hidden;
      min-height: 250px;
      padding: 28px;
      border: 1px solid rgba(60, 175, 232, .4);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(16, 45, 82, .87), rgba(8, 23, 47, .95));
      box-shadow: 0 18px 50px #0005;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      transition: transform .25s, border-color .25s
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--sky)
    }

    .card.academy {
      border-color: rgba(0, 240, 255, .4);
      background: linear-gradient(145deg, #12294f, #08172f)
    }

    .card.academy:hover {
      border-color: var(--cyan)
    }

    .card-icon {
      font-size: 38px;
      margin-bottom: 12px
    }

    .card h2 {
      font-size: 23px;
      margin: 0 0 8px;
      color: #fff
    }

    .card p {
      color: #afc4d9;
      line-height: 1.7;
      margin: 0;
      font-size: 14px
    }

    .card .go {
      border: 0;
      border-radius: 999px;
      padding: 12px 20px;
      font-weight: 800;
      background: var(--gold);
      color: #14213a;
      cursor: pointer;
      transition: .2s
    }

    .card.academy .go {
      background: var(--cyan)
    }

    .card .go:hover {
      filter: brightness(1.1);
      transform: scale(1.03)
    }

    .quick {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .footer {
      margin-top: 30px;
      color: #6985a5;
      font-size: 11px;
      letter-spacing: .08em
    }

    @media(max-width:820px) {
      .topbar {
        grid-template-columns: 1fr auto;
        grid-template-areas: "brand lang" "nav nav"
      }

      .brand {
        grid-area: brand
      }

      .lang-btn {
        grid-area: lang
      }

      .main-nav {
        grid-area: nav;
        justify-content: flex-start
      }

      .brand small {
        display: none
      }
    }

    @media(max-width:650px) {
      .cards {
        grid-template-columns: 1fr
      }

      .card {
        min-height: 200px
      }

      .tab {
        padding: 9px 13px;
        font-size: 13px
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div class="portal">
    <div class="space-background" aria-hidden="true">
      <canvas class="orbital-network-canvas" id="orbital-network-canvas"></canvas>
    </div>
    <header class="topbar">
      <button class="brand" onclick="AH.go('home')" aria-label="AstroHeritage">
        <img class="logo" src="logos.png" alt="">
        <span><strong>ASTRO<b>HERITAGE</b></strong><small data-i18n="brandSub">Space Archaeology &
            Exploration</small></span>
      </button>
      <nav class="main-nav" aria-label="Main">
        <button class="tab" data-section="home" onclick="AH.go('home')"><span class="ico"
            aria-hidden="true">⌂</span><span data-i18n="home">Home</span></button>
        <button class="tab" data-section="museum" onclick="AH.go('museum')"><span class="ico"
            aria-hidden="true">🪐</span><span data-i18n="museum">Space Museum</span></button>
        <button class="tab" data-section="academy" onclick="AH.go('academy')"><span class="ico"
            aria-hidden="true">🚀</span><span data-i18n="academy">Space Archaeology</span></button>
      </nav>
      <button class="lang-btn" id="lang-btn" onclick="AH.toggleLang()" aria-label="Language"><span
          aria-hidden="true">🌐</span><span data-i18n="langBtn">عربي</span></button>
    </header>

    <nav class="subbar" id="subbar" aria-label="Section" hidden></nav>

    <main class="workspace">
      <section id="panel-home" class="panel active">
        <div class="home">
          <div class="home-inner">
            <div class="eyebrow" data-i18n="eyebrow">Explore • Discover • Preserve</div>
            <h1 data-i18n="title">Journey Through Space Heritage</h1>
            <p class="lead" data-i18n="lead"></p>
            <div class="cards">
              <article class="card">
                <div>
                  <div class="card-icon" aria-hidden="true">🪐</div>
                  <h2 data-i18n="museum">Space Museum</h2>
                  <p data-i18n="museumDesc"></p>
                </div>
                <div class="quick" data-quick="museum"></div>
                <button class="go" onclick="AH.go('museum')" data-i18n="museumBtn">Enter the Museum →</button>
              </article>
              <article class="card academy">
                <div>
                  <div class="card-icon" aria-hidden="true">🚀</div>
                  <h2 data-i18n="academy">Space Archaeology</h2>
                  <p data-i18n="academyDesc"></p>
                </div>
                <div class="quick" data-quick="academy"></div>
                <button class="go" onclick="AH.go('academy')" data-i18n="academyBtn">Start Learning →</button>
              </article>
            </div>
            <div class="footer" data-i18n="footer">ONE CONNECTED PLATFORM · MUSEUM + LEARNING LABS</div>
          </div>
        </div>
      </section>
      <section id="panel-museum" class="panel"><iframe id="museum-frame" title="AstroHeritage Space Museum"></iframe>
      </section>
      <section id="panel-academy" class="panel"><iframe id="academy-frame" title="Space Archaeology"></iframe>
      </section>
      <div class="loader" id="loader" hidden aria-live="polite"><i></i></div>
    </main>
  </div>

  <script>
    const PAGE_URLS = {
      museum: 'space_museum.html',
      academy: 'space_archaeology_dashboard.html'
    };

    const I18N = {
      en: {
        brandSub: 'Space Archaeology & Exploration', home: 'Home', museum: 'Space Museum', academy: 'Space Archaeology', langBtn: 'عربى',
        eyebrow: 'Explore â€¢ Discover â€¢ Preserve', title: 'Journey Through Space Heritage',
        lead: 'Explore humanityâ€™s legacy beyond Earth. Visit the interactive space museum, investigate historic spacecraft and abandoned missions, then develop your skills in the Generations Lab.',
        museumDesc: 'Travel to the Moon and Mars galleries, then explore the interactive artifact map and the stories behind humanity’s space exploration legacy.',
        academyDesc: 'Explore hands-on STEM missions by age group in the Generations Lab.',
        museumBtn: 'Enter the Museum ', academyBtn: 'Start Learning  ',
        footer: 'ONE CONNECTED PLATFORM Â· MUSEUM + LEARNING LABS', pageTitle: 'AstroHeritage | Space Archaeology & Exploration',
        sub: {
          museum: { label: 'Space Museum', overview: 'Main Hall', moon: 'Moon Gallery', mars: 'Mars Gallery', map: 'Artifact Map' },
          academy: { label: 'Learning', lab: 'Generations Lab' }
        }
      },
      ar: {
        brandSub: 'علم آثار الفضاء واستكشافه', home: 'الرئيسية', museum: 'متحف الفضاء', academy: 'علم آثار الفضاء', langBtn: 'English',
        eyebrow: 'استكشف • اكتشف • احفظ', title: 'رحلة عبر تراث الفضاء',
        lead: 'استكشف إرث البشرية خارج الأرض. زر المتحف التفاعلي، وتتبّع المركبات التاريخية والمهمات المهجورة، ثم طوّر مهاراتك في مختبر الأجيال.',
        museumDesc: 'سافر إلى قاعتي القمر والمريخ، ثم تصفّح خريطة القطع الأثرية التفاعلية واكتشف القصص وراء إرث البشرية في استكشاف الفضاء.',
        academyDesc: 'استكشف مهام STEM التطبيقية حسب الفئة العمرية في مختبر الأجيال.',
        museumBtn: '← ادخل المتحف', academyBtn: '← ابدأ التعلّم',
        footer: 'منصة واحدة متكاملة · المتحف + مختبرات التعلّم', pageTitle: 'أسترو هيريتدج | علم آثار الفضاء واستكشافه',
        sub: {
          museum: { label: 'متحف الفضاء', overview: 'القاعة الرئيسية', moon: 'قاعة القمر', mars: 'قاعة المريخ', map: 'خريطة الآثار' },
          academy: { label: 'التعلم', lab: 'مختبر الأجيال' }
        }
      }
    };

    const SECTIONS = { museum: ['overview', 'moon', 'mars', 'map'], academy: ['lab'] };
    const DEFAULT_VIEW = { museum: 'overview', academy: 'lab' };
    // which iframe renders each view
    const FRAME_OF = { overview: 'museum', moon: 'museum', mars: 'museum', map: 'academy', lab: 'academy' };
    const SECTION_OF = {}; Object.keys(SECTIONS).forEach(s => SECTIONS[s].forEach(v => SECTION_OF[v] = s));
    const $ = id => document.getElementById(id);

    const AH = {
      lang: 'en',
      state: { section: 'home', view: null },
      lastView: { museum: 'overview', academy: 'lab' },
      frames: { museum: $('museum-frame'), academy: $('academy-frame') },
      loaded: { museum: false, academy: false },
      started: { museum: false, academy: false },
      pending: { museum: null, academy: null },
      sentAt: { museum: 0, academy: 0 },
      suppressHash: false,

      init() {
        try { const l = localStorage.getItem('ah-lang'); if (l === 'ar' || l === 'en') this.lang = l; } catch (e) { }
        window.addEventListener('message', e => this.onMessage(e));
        window.addEventListener('hashchange', () => { if (this.suppressHash) { this.suppressHash = false; return; } this.fromHash(); });
        this.applyLang();
        this.fromHash();
      },

      frameOfState() { return this.state.section === 'home' ? null : FRAME_OF[this.state.view]; },

      applyLang() {
        const L = I18N[this.lang];
        document.documentElement.lang = this.lang;
        document.documentElement.dir = this.lang === 'ar' ? 'rtl' : 'ltr';
        document.querySelectorAll('[data-i18n]').forEach(el => { if (L[el.dataset.i18n] != null) el.textContent = L[el.dataset.i18n]; });
        document.querySelectorAll('[data-quick]').forEach(box => {
          const sec = box.dataset.quick; box.innerHTML = '';
          SECTIONS[sec].filter(v => v !== 'overview' && (sec !== 'museum' || (v !== 'moon' && v !== 'mars' && v !== 'map')) && (sec !== 'academy' || v !== 'lab')).forEach(v => {
            const b = document.createElement('button'); b.className = 'chip'; b.textContent = L.sub[sec][v];
            b.onclick = () => this.go(sec, v); box.appendChild(b);
          });
        });
        this.render();
      },

      toggleLang() {
        this.lang = this.lang === 'en' ? 'ar' : 'en';
        try { localStorage.setItem('ah-lang', this.lang); } catch (e) { }
        this.applyLang();
        ['museum', 'academy'].forEach(f => { if (this.loaded[f]) this.send(f, { lang: this.lang }); });
      },

      fromHash() {
        const [s, v] = (location.hash || '').replace('#', '').split('/');
        if (s === 'museum' || s === 'academy') this.go(s, SECTIONS[s].includes(v) ? v : null, { noHash: true });
        else this.go('home', null, { noHash: true });
      },

      go(section, view, opts = {}) {
        if (section !== 'home') view = view || this.lastView[section] || DEFAULT_VIEW[section];
        this.state = { section, view: section === 'home' ? null : view };
        if (section !== 'home') this.lastView[section] = view;
        this.render();
        if (section !== 'home') {
          const f = FRAME_OF[view];
          this.ensureLoaded(f);
          if (this.loaded[f]) this.send(f, { view }); else this.pending[f] = view;
        }
        if (!opts.noHash) this.setHash();
      },

      setHash() {
        const h = this.state.section === 'home' ? '#home' : '#' + this.state.section + '/' + this.state.view;
        if (location.hash === h) return;
        this.suppressHash = true;
        try { location.hash = h; } catch (e) { this.suppressHash = false; }
        setTimeout(() => { this.suppressHash = false; }, 50);
      },

      render() {
        const { section, view } = this.state, L = I18N[this.lang], f = this.frameOfState();
        document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + (f || 'home')));
        document.querySelectorAll('.tab').forEach(b => {
          if (b.dataset.section === section) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
        });
        const bar = $('subbar');
        if (section === 'home') { bar.hidden = true; bar.innerHTML = ''; }
        else {
          bar.hidden = false; bar.innerHTML = '';
          const lab = document.createElement('span'); lab.className = 'section-label'; lab.textContent = L.sub[section].label; bar.appendChild(lab);
          SECTIONS[section].filter(v => section !== 'museum' || (v !== 'moon' && v !== 'mars')).forEach(v => {
            const b = document.createElement('button'); b.className = 'chip'; b.textContent = L.sub[section][v];
            if (v === view) b.setAttribute('aria-current', 'page');
            b.onclick = () => this.go(section, v); bar.appendChild(b);
          });
        }
        document.title = section === 'home' ? L.pageTitle : L.sub[section][view] + ' · AstroHeritage';
        $('loader').hidden = !(f && !this.loaded[f]);
      },

      ensureLoaded(f) {
        if (this.started[f]) return;
        this.started[f] = true;
        const fr = this.frames[f];
        fr.onload = () => {
          this.loaded[f] = true;
          this.send(f, { lang: this.lang, view: this.pending[f] });
          this.pending[f] = null;
          if (this.frameOfState() === f) $('loader').hidden = true;
        };
        fr.src = PAGE_URLS[f];
      },

      send(f, payload) {
        const w = this.frames[f].contentWindow; if (!w) return;
        this.sentAt[f] = Date.now();
        try { w.postMessage(Object.assign({ ah: 'cmd' }, payload), '*'); } catch (e) { }
      },

      onMessage(e) {
        const d = e.data; if (!d || !d.ah) return;
        const f = ['museum', 'academy'].find(k => this.frames[k].contentWindow === e.source);
        if (!f) return;
        if (d.ah === 'goto' && SECTION_OF[d.view]) { this.go(SECTION_OF[d.view], d.view); return; }
        if (d.ah !== 'state' || FRAME_OF[d.view] !== f) return;
        // ignore echoes of our own commands and messages from a frame that is not on screen
        if (Date.now() - this.sentAt[f] < 400 || this.frameOfState() !== f) return;
        const section = SECTION_OF[d.view];
        this.lastView[section] = d.view;
        if (this.state.view !== d.view) { this.state = { section, view: d.view }; this.render(); this.setHash(); }
      }
    };

    function initOrbitalNetwork() {
      const canvas = $('orbital-network-canvas');
      const ctx = canvas.getContext('2d');
      const particles = [];
      let width = 0;
      let height = 0;
      let pixelRatio = 1;

      function resize() {
        pixelRatio = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }

      window.addEventListener('resize', resize);
      resize();

      for (let index = 0; index < 100; index++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 2.5,
          vy: (Math.random() - 0.5) * 2.5,
          radius: Math.random() * 2 + 0.5
        });
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < particles.length; i++) {
          const particle = particles[i];
          particle.x += particle.vx;
          particle.y += particle.vy;

          if (particle.x < 0 || particle.x > width) particle.vx *= -1;
          if (particle.y < 0 || particle.y > height) particle.vy *= -1;

          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#3CAFE8';
          ctx.fill();

          for (let j = i + 1; j < particles.length; j++) {
            const dx = particle.x - particles[j].x;
            const dy = particle.y - particles[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 280) {
              ctx.beginPath();
              ctx.strokeStyle = `rgba(60, 175, 232, ${0.4 * (1 - distance / 280)})`;
              ctx.lineWidth = 1.2;
              ctx.moveTo(particle.x, particle.y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
        }

        requestAnimationFrame(animate);
      }

      animate();
    }

    initOrbitalNetwork();
    AH.init();
  </script>
</body>
